<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Save Xiaobing | WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body { padding: 0; margin: 0; background: #000; overflow: hidden; }
      #unity-container { width: 100vw; height: 56.25vw; max-width: 100%; max-height: 100vh; aspect-ratio: 16 / 9; margin: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
      #unity-canvas { width: 100% !important; height: 100% !important; }
      #community-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.85); }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
    </div>

    <div id="community-wrapper">
      <button onclick="document.getElementById('community-wrapper').style.display='none'" style="position:absolute; right:20px; top:20px; padding:10px 20px; z-index:10001;">返回游戏</button>
      <iframe src="community_app.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <script>
      var buildUrl = "Build"; // 必须是大写 B，因为你的文件夹叫 Build
      var loaderUrl = buildUrl + "/WebGL_Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL_Build.data",           // 确认无后缀
        frameworkUrl: buildUrl + "/WebGL_Build.framework.js",
        codeUrl: buildUrl + "/WebGL_Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Save Xiaobing",
        productVersion: "1.0",
        matchWebGLToCanvasSize: false,
        devicePixelRatio: window.devicePixelRatio || 1,
      };
      var canvas = document.querySelector("#unity-canvas");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
        });
      };

      // 社区接口
      window.OpenCommunity = function() {
        document.getElementById('community-wrapper').style.display = 'block';
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
